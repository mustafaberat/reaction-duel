name: reaction_duel
description: Two-player reflex duel on one phone. Wait for the color, tap first.
publish_to: 'none'
# vX.Y.Z+CODE — X Play yüklemesi, Y stable, Z her commit.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
          weight: 400
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0D0E11"
  adaptive_icon_background: "#0D0E11"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#0D0E11"
    theme_color: "#0D0E11"
